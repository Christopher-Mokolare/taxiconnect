<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaxiConnect — Operator Admin</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f7fb;color:#101828}header{background:#111827;color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}main{max-width:1200px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 8px 24px #1018280d}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:16px}.tabs button{border:0;padding:10px 14px;border-radius:10px;background:#e4e7ec;font-weight:700}.tabs button.active{background:#635bff;color:#fff}.tab{display:none}.tab.active{display:block}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}input,select,button{font:inherit;padding:10px;border-radius:10px;border:1px solid #d0d5dd}button{cursor:pointer;background:#111827;color:#fff;border:0;font-weight:700}.danger{background:#d92d20}.good{background:#039855}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid #eaecf0}.muted{color:#667085;font-size:13px}.login{max-width:420px;margin:80px auto}.hidden{display:none!important}.error{color:#b42318}</style></head>
<body><header><strong>🏢 TaxiConnect — Operator Admin</strong><button onclick="logout()">Sign out</button></header><main>
<section id="login" class="card login"><h2>Operator administration</h2><input id="name" placeholder="Operator Admin name"><input id="pin" type="password" placeholder="Operator Admin PIN" style="margin-top:8px"><button onclick="login()" style="width:100%;margin-top:8px">Sign in</button><p id="err" class="error"></p></section>
<section id="app" class="hidden"><div id="context" class="card"></div><div class="tabs"><button class="active" onclick="tab('overview',this)">Overview</button><button onclick="tab('members',this)">People</button><button onclick="tab('taxis',this)">Fleet</button><button onclick="tab('routes',this)">Routes</button></div>
<div id="overview" class="tab active"><div class="grid" id="stats"></div></div>
<div id="members" class="tab"><div class="card"><h3>Add driver/conductor</h3><div class="form"><input id="mName" placeholder="Full name"><input id="mPhone" placeholder="Phone"><select id="mRole"><option>driver</option><option>conductor</option></select><button onclick="createMember()">Create</button></div></div><div class="card" id="membersTable"></div></div>
<div id="taxis" class="tab"><div class="card"><h3>Fleet</h3><div class="form"><input id="tReg" placeholder="Vehicle registration"><input id="tCap" type="number" value="15" min="1" max="22"><button onclick="createTaxi()">Register taxi</button></div></div><div class="card" id="taxisTable"></div></div>
<div id="routes" class="tab"><div class="card" id="routesTable"></div><div class="card"><h3>Route pickup points</h3><div class="form"><select id="pointRoute"></select><input id="pName" placeholder="Point name"><select id="pType"><option>RANK</option><option>PICKUP</option><option>DROP_OFF</option></select><input id="pSeq" type="number" value="0"><input id="pAddress" placeholder="Address"><button onclick="addPoint()">Add point</button></div></div></div>
</section></main>
<script>
let token=sessionStorage.getItem("tc_operator_token")||"",data=null;const $=x=>document.getElementById(x);
async function api(path,opt={}){const h={"Content-Type":"application/json",...(opt.headers||{})};if(token)h.Authorization="Bearer "+token;const r=await fetch("/api"+path,{...opt,headers:h});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Request failed");return d}
async function login(){try{const d=await api("/auth/login",{method:"POST",body:JSON.stringify({role:"operator_admin",name:$("name").value,pin:$("pin").value})});token=d.token;sessionStorage.setItem("tc_operator_token",token);$("login").classList.add("hidden");$("app").classList.remove("hidden");await load()}catch(e){$("err").textContent=e.message}}
function logout(){sessionStorage.removeItem("tc_operator_token");location.reload()}
function tab(id,b){document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));$(id).classList.add("active");document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));b.classList.add("active")}
const esc=v=>String(v??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
async function load(){data=(await api("/operator/overview"));const o=data.operator;$("context").innerHTML="<h2>"+esc(o.name)+"</h2><p class=muted>"+esc(o.registration_number)+" · "+esc(o.email)+" · "+esc(o.phone)+"</p>";$("stats").innerHTML=[["Members",data.members.length],["Taxis",data.taxis.length],["Routes",data.routes.filter(x=>x.authorized).length],["Active trips",data.activeTrips]].map(x=>'<div class=card><span class=muted>'+x[0]+'</span><h2>'+x[1]+"</h2></div>").join("");renderMembers();renderTaxis();renderRoutes()}
function renderMembers(){$("membersTable").innerHTML="<h3>People</h3><table><tr><th>Name</th><th>Role</th><th>Phone</th><th>Status</th><th></th></tr>"+data.members.map(m=>'<tr><td>'+esc(m.name)+'</td><td>'+esc(m.membership_role)+'</td><td>'+esc(m.phone)+'</td><td>'+esc(m.active?"ACTIVE":"INACTIVE")+'</td><td><button class="'+(m.active?"danger":"good")+'" onclick="memberStatus(\''+m.id+'\','+(m.active?0:1)+')">'+(m.active?"Deactivate":"Activate")+"</button></td></tr>").join("")+"</table>"}
function renderTaxis(){$("taxisTable").innerHTML="<table><tr><th>Registration</th><th>Driver</th><th>Status</th><th>Capacity</th><th>Authorized routes</th><th></th></tr>"+data.taxis.map(t=>'<tr><td>'+esc(t.vehicle_registration_number)+'</td><td>'+esc(t.driver_name)+'</td><td>'+esc(t.status)+'</td><td>'+t.capacity+'</td><td>'+t.authorized_route_count+'</td><td><button class="'+(t.active?"danger":"good")+'" onclick="taxiStatus(\''+t.id+'\','+(t.active?0:1)+')">'+(t.active?"Deactivate":"Activate")+"</button></td></tr>").join("")+"</table>"}
function renderRoutes(){$("routesTable").innerHTML="<h3>Authorized routes</h3><table><tr><th>Route</th><th>Mode</th><th>Status</th><th></th></tr>"+data.routes.map(r=>'<tr><td>'+esc(r.name)+'</td><td>'+esc(r.service_mode)+'</td><td>'+esc(r.authorized?"AUTHORIZED":"REVOKED")+'</td><td>'+(r.authorized?'<button class=danger onclick="revokeRoute(\''+r.id+'\')">Revoke</button>':"")+"</td></tr>").join("")+"</table>";$("pointRoute").innerHTML=data.routes.filter(r=>r.authorized).map(r=>'<option value="'+r.id+'">'+esc(r.name)+"</option>").join("")}
async function createMember(){await api("/operator/members/create",{method:"POST",body:JSON.stringify({name:$("mName").value,phone:$("mPhone").value,role:$("mRole").value})});await load()}
async function createTaxi(){await api("/operator/taxi/create",{method:"POST",body:JSON.stringify({vehicleRegistrationNumber:$("tReg").value,capacity:Number($("tCap").value)})});await load()}
async function memberStatus(id,active){await api("/operator/member/status",{method:"POST",body:JSON.stringify({userId:id,active:!!active})});await load()}
async function taxiStatus(id,active){await api("/operator/taxi/status",{method:"POST",body:JSON.stringify({taxiId:id,active:!!active})});await load()}
async function revokeRoute(id){await api("/operator/route/revoke",{method:"POST",body:JSON.stringify({routeId:id})});await load()}
async function addPoint(){await api("/operator/route-points",{method:"POST",body:JSON.stringify({routeId:$("pointRoute").value,name:$("pName").value,pointType:$("pType").value,sequence:Number($("pSeq").value),address:$("pAddress").value})});await load()}
if(token){$("login").classList.add("hidden");$("app").classList.remove("hidden");load().catch(e=>{sessionStorage.removeItem("tc_operator_token");location.reload()})}
</script></body></html>
