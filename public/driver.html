<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaxiConnect — Driver</title>
<meta name="theme-color" content="#1a1a2e">
<link rel="manifest" href="/driver-manifest.json">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"
        integrity="sha384-sEVIly94UBRLKWdkYoPpSG7GD/e79YHMrxVyZaOk712Ga7+EAw6w1EFi+xBzBdd+"
        crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"
        integrity="sha384-EkqK+ezBWJuvO3hfrSx2iVqr3YQbhmnzn8kPhOpBZ+0GMVU5oGSgptwIu8D84HjE"
        crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"
        integrity="sha384-1/m+A1jVWbD3yiK3/vtFvm1+LjK1WLpSoDY+Kaxppwn/yP9BVSgdHTNQVOjrzUO5"
        crossorigin="anonymous"></script>
<script src="/firebase-config.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,sans-serif;background:#f0f2f5;min-height:100vh}
  header{background:#1a1a2e;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
  header h1{font-size:16px}
  .btn-link{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px}
  .screen{display:none;padding:12px;max-width:420px;margin:0 auto}
  .screen.active{display:block}
  .card{background:#fff;border-radius:12px;padding:16px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .card h3{font-size:12px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
  .btn{display:block;width:100%;padding:14px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;margin-top:10px}
  .btn-green{background:#28a745;color:#fff}
  .btn-red{background:#dc3545;color:#fff}
  .btn-blue{background:#007bff;color:#fff}
  input[type=tel],input[type=text]{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;font-size:14px;margin-top:6px}
  .otp-input{letter-spacing:8px;font-size:22px;text-align:center}
  .route-row{display:flex;gap:8px;margin-top:8px}
  .route-btn{flex:1;padding:14px 8px;border:2px solid #ddd;border-radius:10px;background:#fff;font-size:13px;font-weight:700;cursor:pointer;text-align:center;line-height:1.4}
  .route-btn.sel{border-color:#28a745;background:#f0fff4;color:#155724}
  .counter-wrap{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:10px}
  .cbtn{width:44px;height:44px;border:none;border-radius:50%;font-size:22px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .cbtn.minus{background:#f8d7da;color:#721c24}
  .cbtn.plus{background:#d4edda;color:#155724}
  .cval{font-size:32px;font-weight:700;min-width:48px;text-align:center}
  .needs-box{border-radius:10px;padding:14px;text-align:center;margin-top:10px}
  .needs-box .num{font-size:36px;font-weight:700}
  .needs-box .lbl{font-size:12px;margin-top:2px}
  .nb-loading{background:#fff3cd;color:#856404}
  .nb-full{background:#d4edda;color:#155724}
  .alert{padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:10px;border-left:4px solid}
  .a-success{background:#d4edda;border-color:#28a745}
  .a-danger{background:#f8d7da;border-color:#dc3545}
  .summon-banner{background:#e94560;color:#fff;padding:14px;border-radius:10px;margin-bottom:10px;font-weight:600;font-size:14px;display:none}
  #recaptcha-container{margin-top:10px}
  .spinner{display:inline-block;width:16px;height:16px;border:2px solid #ddd;border-top-color:#28a745;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <h1>🚗 TaxiConnect — Driver</h1>
  <button class="btn-link" id="signOutBtn" onclick="signOut()" style="display:none">Sign Out</button>
</header>

<!-- AUTH -->
<div id="authScreen" class="screen active">
  <div class="card" style="margin-top:20px">
    <h3>Driver Sign In</h3>
    <p style="font-size:13px;color:#666;margin-bottom:4px">Enter your name and the driver PIN.</p>
    <input type="text" id="nameInput" placeholder="Your name (e.g. John)" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px;margin-top:6px" />
    <input type="password" id="pinInput" placeholder="Driver PIN" maxlength="20" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:18px;letter-spacing:4px;text-align:center;margin-top:8px" />
    <button class="btn btn-green" onclick="pinLogin()">Enter App</button>
  </div>
  <div id="authError" class="alert a-danger" style="display:none;margin-top:10px"></div>
</div>

<!-- APP -->
<div id="appScreen" class="screen">
  <div id="summonBanner" class="summon-banner"></div>

  <div id="checkInCard" class="card" style="margin-top:10px">
    <h3>Go Live</h3>

    <label style="font-size:12px;color:#666;margin-top:4px;display:block">
      Taxi
    </label>

    <select
      id="taxiSelect"
      style="width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;font-size:14px;margin-top:6px"
      onchange="onTaxiChanged()">
    </select>

    <div
      id="taxiInfo"
      style="font-size:12px;color:#666;margin-top:6px">
    </div>

    <label style="font-size:12px;color:#666;margin-top:14px;display:block">
      Route
    </label>

    <select
      id="routeSelect"
      style="width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;font-size:14px;margin-top:6px"
      onchange="onRouteChanged()">
    </select>

    <label style="font-size:12px;color:#666;margin-top:14px;display:block">
      From
    </label>

    <select
      id="originPoint"
      style="width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;font-size:14px;margin-top:6px"
      onchange="validateJourney()">
      <option value="">Select starting point</option>
    </select>

    <label style="font-size:12px;color:#666;margin-top:14px;display:block">
      To
    </label>

    <select
      id="destinationPoint"
      style="width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;font-size:14px;margin-top:6px"
      onchange="validateJourney()">
      <option value="">Select destination</option>
    </select>

    <div
      id="journeyNote"
      style="font-size:12px;color:#666;margin-top:8px">
      Select your FROM and TO points.
    </div>

    <div
      id="capacityInfo"
      class="needs-box nb-loading"
      style="margin-top:12px">
      <div class="num" id="capVal">0</div>
      <div class="lbl">taxi capacity</div>
    </div>

    <label style="font-size:12px;color:#666;margin-top:12px;display:block">
      Passengers Already Onboard
    </label>

    <div class="counter-wrap">
      <button class="cbtn minus" onclick="adjOnboard(-1)">−</button>
      <span class="cval" id="onboardVal">0</span>
      <button class="cbtn plus" onclick="adjOnboard(1)">+</button>
    </div>

    <div class="needs-box nb-loading" id="previewBox">
      <div class="num" id="previewNum">0</div>
      <div class="lbl">passengers needed</div>
    </div>

    <button
      class="btn btn-green"
      id="goLiveBtn"
      onclick="goLive()">
      ✅ GO LIVE
    </button>
  </div>

  <div id="liveCard" class="card" style="display:none;margin-top:10px">
    <h3>You Are Live</h3>

    <div id="liveInfo"></div>

    <div class="alert a-success" id="liveJourneyInfo" style="display:none"></div>

    <label style="font-size:12px;color:#666;margin-top:14px;display:block;font-weight:600">
      Update Passengers Onboard
    </label>

    <div class="counter-wrap" style="margin-top:8px">
      <button class="cbtn minus" onclick="adjLive(-1)">−</button>
      <span class="cval" id="liveVal">0</span>
      <button class="cbtn plus" onclick="adjLive(1)">+</button>
    </div>

    <div class="needs-box nb-loading" id="liveNeedsBox">
      <div class="num" id="liveNeedsNum">0</div>
      <div class="lbl" id="liveNeedsLbl">passengers needed</div>
    </div>

    <button class="btn btn-blue" onclick="updatePassengers()">
      🔄 Update Count
    </button>

    <button
      class="btn btn-green"
      id="departBtn"
      onclick="setTripStatus('DEPARTED')"
      style="display:none">
      🚕 DEPART
    </button>

    <button
      class="btn btn-blue"
      id="arriveBtn"
      onclick="setTripStatus('ARRIVED')"
      style="display:none">
      🏁 ARRIVED
    </button>

    <button
      class="btn btn-red"
      onclick="goOffline()"
      style="margin-top:8px">
      🔴 Go Offline
    </button>
  </div>
</div>
<script>
/*
 * TaxiConnect Driver
 *
 * PRIMARY:
 *   Cloudflare Worker API + D1
 *
 * Firebase:
 *   Firebase scripts/config remain loaded above for compatibility/fallback.
 *
 * IMPORTANT:
 *   The Driver UI does not modify Firebase data when Cloudflare succeeds.
 */

const API_BASE = '/api';

let authToken = sessionStorage.getItem('tc_cf_token') || '';
let driverUser = null;

let assignedTaxis = [];
let driverRoutes = [];
let selectedTaxi = null;
let selectedRoute = null;
let routePoints = [];

let originPointId = '';
let destinationPointId = '';

let capacity = 0;
let onboard = 0;
let liveOnboard = 0;

let activeTripId = null;
let activeRouteId = null;
let activeTaxiId = null;

let driverName = '';


// ============================================================
// Generic API
// ============================================================

async function api(path, options = {}) {
  const headers = {
    'Content-Type': 'application/json',
    ...(options.headers || {})
  };

  if (authToken) {
    headers.Authorization = `Bearer ${authToken}`;
  }

  const response = await fetch(`${API_BASE}${path}`, {
    ...options,
    headers
  });

  let data = null;

  try {
    data = await response.json();
  } catch {
    data = {};
  }

  if (!response.ok) {
    const message =
      data?.error ||
      data?.message ||
      `Request failed (${response.status})`;

    throw new Error(message);
  }

  return data;
}


// ============================================================
// Auth
// ============================================================

async function pinLogin() {
  const name = document.getElementById('nameInput').value.trim();
  const pin = document.getElementById('pinInput').value.trim();

  hideErr();

  if (!name) {
    showErr('Enter your name.');
    return;
  }

  if (!pin) {
    showErr('Enter your PIN.');
    return;
  }

  try {
    const result = await api('/auth/login', {
      method: 'POST',
      body: JSON.stringify({
        pin,
        role: 'driver',
        name
      })
    });

    authToken = result.token;
    driverUser = result.user || null;

    sessionStorage.setItem('tc_cf_token', authToken);
    sessionStorage.setItem('tc_role', 'driver');
    sessionStorage.setItem(
      'tc_name',
      driverUser?.name || name
    );

    driverName = driverUser?.name || name;

    document.getElementById('signOutBtn').style.display = 'block';

    show('appScreen');

    requestNotificationPermission();

    await loadDriver();

  } catch (err) {
    console.error('Cloudflare driver login failed:', err);

    /*
     * Firebase remains available as the legacy fallback.
     *
     * We intentionally do not automatically submit Firebase
     * credentials here because Cloudflare is now authoritative.
     * The Firebase libraries/config remain intact for rollback.
     */

    showErr(err.message || 'Login failed.');
  }
}


async function restoreSession() {
  if (!authToken) return false;

  try {
    const result = await api('/driver/session');

    driverUser = result.user || null;
    driverName =
      driverUser?.name ||
      sessionStorage.getItem('tc_name') ||
      'Driver';

    sessionStorage.setItem('tc_role', 'driver');
    sessionStorage.setItem('tc_name', driverName);

    document.getElementById('signOutBtn').style.display = 'block';

    show('appScreen');

    requestNotificationPermission();

    await loadDriver();

    return true;

  } catch (err) {
    console.warn('Stored Cloudflare session is no longer valid:', err);

    authToken = '';
    driverUser = null;

    sessionStorage.removeItem('tc_cf_token');
    sessionStorage.removeItem('tc_role');
    sessionStorage.removeItem('tc_name');

    return false;
  }
}


async function signOut() {
  try {
    if (activeTripId) {
      await goOffline();
    }
  } catch (err) {
    console.warn('Could not end active trip during sign out:', err);
  }

  try {
    await api('/auth/logout', {
      method: 'POST'
    });
  } catch {
    // Local session cleanup still proceeds.
  }

  authToken = '';
  driverUser = null;

  sessionStorage.removeItem('tc_cf_token');
  sessionStorage.removeItem('tc_role');
  sessionStorage.removeItem('tc_name');

  assignedTaxis = [];
  driverRoutes = [];
  selectedTaxi = null;
  selectedRoute = null;
  routePoints = [];

  activeTripId = null;
  activeRouteId = null;
  activeTaxiId = null;

  document.getElementById('signOutBtn').style.display = 'none';

  resetDriverUI();

  show('authScreen');
}


// ============================================================
// Driver bootstrap
// ============================================================

async function loadDriver() {
  await Promise.all([
    loadDriverTaxis(),
    loadDriverRoutes()
  ]);

  renderTaxis();
  renderRoutes();

  if (driverRoutes.length) {
    await loadRoutePoints(driverRoutes[0].id);
  }

  /*
   * The current session endpoint does not return an active trip
   * directly, so this UI starts from the available assignment.
   *
   * Existing backend trip ownership prevents duplicate go-live.
   */
}


async function loadDriverTaxis() {
  const result = await api('/driver/taxis');

  assignedTaxis = Array.isArray(result.taxis)
    ? result.taxis
    : [];

  if (!assignedTaxis.length) {
    throw new Error(
      'No active taxi is assigned to this driver.'
    );
  }

  selectedTaxi =
    assignedTaxis.find(t => t.taxi_active !== 0) ||
    assignedTaxis[0];

  capacity = Number(selectedTaxi.capacity || 0);

  if (!capacity) {
    throw new Error(
      'The assigned taxi does not have a valid capacity.'
    );
  }

  document.getElementById('capVal').textContent = capacity;
  document.getElementById('onboardVal').textContent = onboard;

  updatePreview();
}


async function loadDriverRoutes() {
  const result = await api('/driver/routes');

  driverRoutes = Array.isArray(result.routes)
    ? result.routes
    : [];

  if (!driverRoutes.length) {
    throw new Error(
      'No authorized route is available for this driver.'
    );
  }

  if (
    selectedTaxi &&
    selectedTaxi.taxi_id
  ) {
    const taxiRoutes = driverRoutes.filter(
      r => r.taxi_id === selectedTaxi.taxi_id
    );

    if (taxiRoutes.length) {
      selectedRoute = taxiRoutes[0];
    }
  }

  selectedRoute ||= driverRoutes[0];
}


// ============================================================
// Taxi selection
// ============================================================

function renderTaxis() {
  const select = document.getElementById('taxiSelect');

  select.innerHTML = '';

  for (const taxi of assignedTaxis) {
    const option = document.createElement('option');

    option.value = taxi.taxi_id;

    const registration =
      taxi.vehicle_registration_number ||
      taxi.taxi_id;

    option.textContent =
      `${registration} · ${taxi.capacity} seats`;

    if (
      selectedTaxi &&
      taxi.taxi_id === selectedTaxi.taxi_id
    ) {
      option.selected = true;
    }

    select.appendChild(option);
  }

  renderTaxiInfo();
}


function renderTaxiInfo() {
  const info = document.getElementById('taxiInfo');

  if (!selectedTaxi) {
    info.textContent = '';
    return;
  }

  const registration =
    selectedTaxi.vehicle_registration_number ||
    selectedTaxi.taxi_id;

  info.textContent =
    `${registration} · ${selectedTaxi.capacity} seats · ${selectedTaxi.operator_name || 'Operator'}`;
}


async function onTaxiChanged() {
  const taxiId =
    document.getElementById('taxiSelect').value;

  selectedTaxi =
    assignedTaxis.find(
      taxi => taxi.taxi_id === taxiId
    ) || null;

  if (!selectedTaxi) return;

  capacity = Number(selectedTaxi.capacity || 0);

  onboard = Math.min(onboard, capacity);

  document.getElementById('capVal').textContent = capacity;
  document.getElementById('onboardVal').textContent = onboard;

  renderTaxiInfo();

  renderRoutes();

  const matchingRoute =
    driverRoutes.find(
      route => route.taxi_id === selectedTaxi.taxi_id
    );

  if (matchingRoute) {
    selectedRoute = matchingRoute;
    document.getElementById('routeSelect').value =
      selectedRoute.id;

    await loadRoutePoints(selectedRoute.id);
  }

  updatePreview();
}


// ============================================================
// Route selection
// ============================================================

function renderRoutes() {
  const select =
    document.getElementById('routeSelect');

  select.innerHTML = '';

  const routesForTaxi =
    selectedTaxi
      ? driverRoutes.filter(
          route => route.taxi_id === selectedTaxi.taxi_id
        )
      : driverRoutes;

  for (const route of routesForTaxi) {
    const option = document.createElement('option');

    option.value = route.id;

    option.textContent =
      route.name ||
      `${route.origin} → ${route.destination}`;

    if (
      selectedRoute &&
      route.id === selectedRoute.id
    ) {
      option.selected = true;
    }

    select.appendChild(option);
  }

  if (!selectedRoute && routesForTaxi.length) {
    selectedRoute = routesForTaxi[0];
    select.value = selectedRoute.id;
  }
}


async function onRouteChanged() {
  const routeId =
    document.getElementById('routeSelect').value;

  selectedRoute =
    driverRoutes.find(
      route => route.id === routeId
    ) || null;

  originPointId = '';
  destinationPointId = '';

  await loadRoutePoints(routeId);
}


async function loadRoutePoints(routeId) {
  if (!routeId) return;

  try {
    const result =
      await api(`/routes/${encodeURIComponent(routeId)}`);

    const availability =
      result.availability || {};

    routePoints =
      Array.isArray(availability.pickupPoints)
        ? availability.pickupPoints
        : [];

    /*
     * Some responses expose pickupPoints under route.
     * Support both shapes without changing the API.
     */
    if (!routePoints.length) {
      routePoints =
        Array.isArray(availability.route?.pickupPoints)
          ? availability.route.pickupPoints
          : [];
    }

    renderJourneyPoints();

  } catch (err) {
    console.error('Could not load route points:', err);

    routePoints = [];

    renderJourneyPoints();

    showErr(
      err.message ||
      'Could not load route journey points.'
    );
  }
}


function renderJourneyPoints() {
  const origin =
    document.getElementById('originPoint');

  const destination =
    document.getElementById('destinationPoint');

  origin.innerHTML =
    '<option value="">Select starting point</option>';

  destination.innerHTML =
    '<option value="">Select destination</option>';

  const sorted =
    [...routePoints].sort(
      (a, b) =>
        Number(a.sequence ?? 0) -
        Number(b.sequence ?? 0)
    );

  for (const point of sorted) {
    if (Number(point.active) === 0) continue;

    const originOption =
      document.createElement('option');

    originOption.value = point.id;
    originOption.textContent = point.name;

    const destinationOption =
      document.createElement('option');

    destinationOption.value = point.id;
    destinationOption.textContent = point.name;

    origin.appendChild(originOption);
    destination.appendChild(destinationOption);
  }

  origin.value = originPointId;
  destination.value = destinationPointId;

  updateJourneyNote();
}


function validateJourney() {
  originPointId =
    document.getElementById('originPoint').value;

  destinationPointId =
    document.getElementById('destinationPoint').value;

  updateJourneyNote();
}


function updateJourneyNote() {
  const note =
    document.getElementById('journeyNote');

  if (!originPointId || !destinationPointId) {
    note.textContent =
      'Select your FROM and TO points.';
    note.style.color = '#666';
    return false;
  }

  if (originPointId === destinationPointId) {
    note.textContent =
      'FROM and TO must be different.';
    note.style.color = '#dc3545';
    return false;
  }

  const from =
    routePoints.find(
      point => point.id === originPointId
    );

  const to =
    routePoints.find(
      point => point.id === destinationPointId
    );

  note.textContent =
    `Journey: ${from?.name || originPointId} → ${to?.name || destinationPointId}`;

  note.style.color = '#155724';

  return true;
}


// ============================================================
// Passenger counters
// ============================================================

function adjOnboard(delta) {
  onboard =
    Math.max(
      0,
      Math.min(
        capacity,
        onboard + delta
      )
    );

  document.getElementById('onboardVal').textContent =
    onboard;

  updatePreview();
}


function updatePreview() {
  const needed =
    Math.max(0, capacity - onboard);

  document.getElementById('previewNum').textContent =
    needed;

  const box =
    document.getElementById('previewBox');

  box.className =
    `needs-box ${
      needed <= 0
        ? 'nb-full'
        : 'nb-loading'
    }`;
}


function adjLive(delta) {
  liveOnboard =
    Math.max(
      0,
      Math.min(
        capacity,
        liveOnboard + delta
      )
    );

  document.getElementById('liveVal').textContent =
    liveOnboard;

  updateLiveNeeds();
}


function updateLiveNeeds() {
  const needed =
    Math.max(0, capacity - liveOnboard);

  document.getElementById('liveNeedsNum').textContent =
    needed;

  const box =
    document.getElementById('liveNeedsBox');

  const label =
    document.getElementById('liveNeedsLbl');

  if (needed <= 0) {
    box.className = 'needs-box nb-full';
    label.textContent = 'TAXI IS FULL';
  } else {
    box.className = 'needs-box nb-loading';
    label.textContent = 'passengers needed';
  }
}


// ============================================================
// Go Live
// ============================================================

async function goLive() {
  hideErr();

  if (!selectedTaxi) {
    alert('Select a taxi.');
    return;
  }

  if (!selectedRoute) {
    alert('Select a route.');
    return;
  }

  if (!validateJourney()) {
    alert('Select a valid FROM and TO journey.');
    return;
  }

  if (originPointId === destinationPointId) {
    alert('FROM and TO must be different.');
    return;
  }

  const button =
    document.getElementById('goLiveBtn');

  button.disabled = true;
  button.innerHTML =
    '<span class="spinner"></span> Going live...';

  try {
    const result =
      await api('/driver/go-live', {
        method: 'POST',
        body: JSON.stringify({
          taxiId: selectedTaxi.taxi_id,
          routeId: selectedRoute.id,
          originPointId,
          destinationPointId,
          passengersOnboard: onboard
        })
      });

    const trip =
      result.trip || {};

    activeTripId = trip.id;
    activeTaxiId = trip.taxiId;
    activeRouteId = trip.routeId;

    capacity =
      Number(trip.capacity || selectedTaxi.capacity);

    liveOnboard =
      Number(
        trip.passengersOnboard ??
        onboard
      );

    document.getElementById('liveVal').textContent =
      liveOnboard;

    updateLiveNeeds();

    const originName =
      trip.originPointName ||
      routePoints.find(
        p => p.id === originPointId
      )?.name ||
      originPointId;

    const destinationName =
      trip.destinationPointName ||
      routePoints.find(
        p => p.id === destinationPointId
      )?.name ||
      destinationPointId;

    document.getElementById('liveInfo').innerHTML = `
      <div class="alert a-success">
        🟢 <strong>LIVE</strong><br>
        ${escapeHtml(
          selectedRoute.name ||
          `${selectedRoute.origin} → ${selectedRoute.destination}`
        )}<br>
        Taxi: ${escapeHtml(
          selectedTaxi.vehicle_registration_number ||
          selectedTaxi.taxi_id
        )}<br>
        Capacity: ${capacity}<br>
        Status: ${escapeHtml(trip.status || 'LOADING')}
      </div>
    `;

    const journeyInfo =
      document.getElementById('liveJourneyInfo');

    journeyInfo.innerHTML =
      `Journey: <strong>${escapeHtml(originName)}</strong> → <strong>${escapeHtml(destinationName)}</strong>`;

    journeyInfo.style.display = 'block';

    document.getElementById('checkInCard').style.display =
      'none';

    document.getElementById('liveCard').style.display =
      'block';

    updateStatusButtons(trip.status);

  } catch (err) {
    console.error('goLive failed:', err);
    alert(err.message || 'Could not go live.');

  } finally {
    button.disabled = false;
    button.innerHTML = '✅ GO LIVE';
  }
}


// ============================================================
// Passenger update
// ============================================================

async function updatePassengers() {
  if (!activeTripId) return;

  try {
    const result =
      await api('/driver/passengers', {
        method: 'POST',
        body: JSON.stringify({
          tripId: activeTripId,
          passengersOnboard: liveOnboard
        })
      });

    liveOnboard =
      Number(
        result.passengersOnboard ??
        liveOnboard
      );

    document.getElementById('liveVal').textContent =
      liveOnboard;

    updateLiveNeeds();

    updateStatusButtons(
      result.status
    );

  } catch (err) {
    console.error('Passenger update failed:', err);
    alert(
      err.message ||
      'Could not update passengers.'
    );
  }
}


// ============================================================
// Trip status
// ============================================================

async function setTripStatus(status) {
  if (!activeTripId) return;

  try {
    const result =
      await api('/driver/status', {
        method: 'POST',
        body: JSON.stringify({
          tripId: activeTripId,
          status
        })
      });

    updateStatusButtons(
      result.status
    );

    if (status === 'ARRIVED') {
      document.getElementById('liveInfo').innerHTML = `
        <div class="alert a-success">
          🏁 Trip arrived successfully.
        </div>
      `;

      setTimeout(() => {
        resetAfterCompletedTrip();
      }, 800);
    }

  } catch (err) {
    console.error('Trip status update failed:', err);
    alert(
      err.message ||
      'Could not update trip status.'
    );
  }
}


function updateStatusButtons(status) {
  const depart =
    document.getElementById('departBtn');

  const arrive =
    document.getElementById('arriveBtn');

  depart.style.display =
    status === 'FULL' ||
    status === 'LOADING' ||
    status === 'COLLECTING'
      ? 'block'
      : 'none';

  arrive.style.display =
    status === 'DEPARTED'
      ? 'block'
      : 'none';
}


// ============================================================
// Offline
// ============================================================

async function goOffline() {
  if (!activeTripId) return;

  try {
    await api('/driver/offline', {
      method: 'POST',
      body: JSON.stringify({
        tripId: activeTripId
      })
    });

    resetAfterCompletedTrip();

  } catch (err) {
    console.error('goOffline failed:', err);

    alert(
      err.message ||
      'Could not go offline.'
    );
  }
}


function resetAfterCompletedTrip() {
  activeTripId = null;
  activeTaxiId = null;
  activeRouteId = null;

  onboard = 0;
  liveOnboard = 0;

  document.getElementById('onboardVal').textContent = '0';

  document.getElementById('checkInCard').style.display =
    'block';

  document.getElementById('liveCard').style.display =
    'none';

  document.getElementById('liveJourneyInfo').style.display =
    'none';

  updatePreview();
}


// ============================================================
// Notifications / summon compatibility
// ============================================================

function requestNotificationPermission() {
  if (
    'Notification' in window &&
    Notification.permission === 'default'
  ) {
    Notification.requestPermission();
  }
}


/*
 * Firebase summon listener is intentionally retained as a
 * compatibility fallback while Durable Object realtime dispatch
 * is being verified.
 *
 * It is NOT used for go-live, passenger counts, authentication,
 * trip state, or D1 persistence.
 */
function listenForSummons() {
  try {
    if (
      typeof firebase === 'undefined' ||
      typeof db === 'undefined'
    ) {
      return;
    }

    if (!selectedRoute) return;

    const legacyRoute =
      selectedRoute.id ||
      selectedRoute.origin;

    db.ref(`summons/${legacyRoute}`).on(
      'value',
      snap => {
        const summon = snap.val();

        if (
          !summon ||
          !summon.timestamp ||
          Date.now() - summon.timestamp >
            5 * 60 * 1000
        ) {
          return;
        }

        showSummon(
          summon.count || 0,
          selectedRoute.name ||
          `${selectedRoute.origin} → ${selectedRoute.destination}`
        );
      }
    );

  } catch (err) {
    console.warn(
      'Legacy Firebase summon fallback unavailable:',
      err
    );
  }
}


function showSummon(count, routeName) {
  const banner =
    document.getElementById('summonBanner');

  banner.textContent =
    `🚨 Conductor needs drivers → ${routeName}! ${count} passengers waiting.`;

  banner.style.display = 'block';

  if (
    'Notification' in window &&
    Notification.permission === 'granted'
  ) {
    new Notification('🚨 TaxiConnect', {
      body:
        `${count} passengers waiting for ${routeName}.`
    });
  }

  setTimeout(() => {
    banner.style.display = 'none';
  }, 30000);
}


// ============================================================
// UI helpers
// ============================================================

function show(id) {
  document
    .querySelectorAll('.screen')
    .forEach(
      screen =>
        screen.classList.remove('active')
    );

  document
    .getElementById(id)
    .classList.add('active');
}


function showErr(message) {
  const element =
    document.getElementById('authError');

  element.textContent = message;
  element.style.display = 'block';
}


function hideErr() {
  const element =
    document.getElementById('authError');

  element.textContent = '';
  element.style.display = 'none';
}


function resetDriverUI() {
  document.getElementById('liveCard').style.display =
    'none';

  document.getElementById('checkInCard').style.display =
    'block';

  document.getElementById('liveJourneyInfo').style.display =
    'none';

  document.getElementById('summonBanner').style.display =
    'none';

  document.getElementById('onboardVal').textContent =
    '0';

  document.getElementById('liveVal').textContent =
    '0';

  updatePreview();
  updateLiveNeeds();
}


function escapeHtml(value) {
  return String(value ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}


// ============================================================
// Bootstrap
// ============================================================

(async function bootstrapDriver() {
  const restored =
    await restoreSession();

  if (!restored) {
    show('authScreen');
  }
})();
</script>
