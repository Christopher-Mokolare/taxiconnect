<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TaxiConnect — Super Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f7fb;color:#101828}
header{background:#111827;color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
main{max-width:1200px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 8px 24px #1018280d}
.kpi b{display:block;font-size:28px;margin-top:5px}.muted{color:#667085;font-size:13px}
.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:16px}.tabs button{border:0;padding:10px 14px;border-radius:10px;background:#e4e7ec;font-weight:700;white-space:nowrap}.tabs button.active{background:#635bff;color:#fff}
.tab{display:none}.tab.active{display:block}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid #eaecf0;vertical-align:top}input,select,button{font:inherit;padding:10px;border-radius:10px;border:1px solid #d0d5dd}button{cursor:pointer;background:#111827;color:#fff;border:0;font-weight:700}.danger{background:#d92d20}.good{background:#039855}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.form button{align-self:end}.hidden{display:none!important}.login{max-width:420px;margin:80px auto}.error{color:#b42318}.pill{padding:3px 7px;border-radius:999px;background:#eef2ff;font-size:11px;font-weight:700}
</style>
</head>
<body>
<header><strong>🛡 TaxiConnect — Super Admin</strong><button onclick="logout()">Sign out</button></header>
<main>
<section id="login" class="card login">
<h2>Platform Administration</h2><p class="muted">Platform-level control plane.</p>
<input id="name" placeholder="Super Admin name"><input id="pin" type="password" placeholder="Super Admin PIN" style="margin-top:8px">
<button onclick="login()" style="width:100%;margin-top:8px">Sign in</button><p id="loginError" class="error"></p>
</section>
<section id="app" class="hidden">
<div class="grid" id="kpis"></div>
<div class="tabs">
<button class="active" onclick="tab('overview',this)">Overview</button><button onclick="tab('operators',this)">Operators</button>
<button onclick="tab('routes',this)">Routes</button><button onclick="tab('users',this)">Users</button>
<button onclick="tab('taxis',this)">Taxis</button><button onclick="tab('trips',this)">Trips</button>
<button onclick="tab('audit',this)">Audit</button><button onclick="tab('incidents',this)">Incidents</button>
</div>
<div id="overview" class="tab active"><div class="card"><h2>Platform health</h2><pre id="health"></pre></div></div>
<div id="operators" class="tab">
<div class="card"><h2>Create operator</h2><div class="form">
<input id="opName" placeholder="Operator name"><input id="opReg" placeholder="Registration number"><input id="opPhone" placeholder="Phone"><input id="opEmail" placeholder="Email"><input id="opAddress" placeholder="Address">
<button onclick="createOperator()">Create</button></div></div><div class="card"><div id="operatorsTable"></div></div></div>
<div id="routes" class="tab">
<div class="card"><h2>Create route</h2><div class="form">
<input id="rOrigin" placeholder="Origin"><input id="rDestination" placeholder="Destination"><input id="rName" placeholder="Display name">
<select id="rMode"><option>RANK_DEPARTURE</option><option>COLLECTION</option><option>HYBRID</option></select><button onclick="createRoute()">Create</button></div></div><div class="card"><div id="routesTable"></div></div></div>
<div id="users" class="tab"><div class="card"><div id="usersTable"></div></div></div>
<div id="taxis" class="tab"><div class="card"><div id="taxisTable"></div></div></div>
<div id="trips" class="tab"><div class="card"><div id="tripsTable"></div></div></div>
<div id="audit" class="tab"><div class="card"><div id="auditTable"></div></div></div>
<div id="incidents" class="tab"><div class="card"><div id="incidentsTable"></div></div></div>
</section></main>
<script>
let token=sessionStorage.getItem("tc_superadmin_token")||"";
const $=id=>document.getElementById(id);
async function api(path,opt={}){const h={"Content-Type":"application/json",...(opt.headers||{})};if(token)h.Authorization="Bearer "+token;const r=await fetch("/api"+path,{...opt,headers:h});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Request failed");return d}
async function login(){try{const d=await api("/auth/login",{method:"POST",body:JSON.stringify({role:"superadmin",name:$("name").value,pin:$("pin").value})});token=d.token;sessionStorage.setItem("tc_superadmin_token",token);$("login").classList.add("hidden");$("app").classList.remove("hidden");await loadAll()}catch(e){$("loginError").textContent=e.message}}
function logout(){token="";sessionStorage.removeItem("tc_superadmin_token");location.reload()}
function tab(id,b){document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));$(id).classList.add("active");document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));b.classList.add("active")}
const esc=v=>String(v??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
async function loadAll(){const [d,h,o,r,u,t,tr,a,i]=await Promise.all([api("/superadmin/dashboard"),api("/superadmin/health"),api("/superadmin/operators"),api("/superadmin/routes"),api("/superadmin/users"),api("/superadmin/taxis"),api("/superadmin/trips"),api("/superadmin/audit"),api("/superadmin/incidents")]);$("kpis").innerHTML=Object.entries(d.dashboard).map(([k,v])=>'<div class="card kpi"><span class="muted">'+esc(k)+'</span><b>'+esc(v)+'</b></div>').join("");$("health").textContent=JSON.stringify(h,null,2);renderOperators(o.operators);renderRoutes(r.routes);renderUsers(u.users);renderTaxis(t.taxis);renderTrips(tr.trips);renderAudit(a.audit);renderIncidents(i.incidents)}
function renderOperators(x){$("operatorsTable").innerHTML="<h3>Operators</h3><table><tr><th>Name</th><th>Registration</th><th>Members</th><th>Taxis</th><th>Routes</th><th>Status</th><th></th></tr>"+x.map(o=>'<tr><td>'+esc(o.name)+'</td><td>'+esc(o.registration_number)+'</td><td>'+o.member_count+'</td><td>'+o.taxi_count+'</td><td>'+o.route_count+'</td><td>'+esc(o.active?"ACTIVE":"INACTIVE")+'</td><td><button class="'+(o.active?"danger":"good")+'" onclick="operatorStatus(\''+o.id+'\','+(o.active?0:1)+')">'+(o.active?"Deactivate":"Activate")+'</button></td></tr>').join("")+"</table>"}
function renderRoutes(x){$("routesTable").innerHTML="<h3>Routes</h3><table><tr><th>Route</th><th>Mode</th><th>Operators</th><th>Taxis</th><th>Status</th><th></th></tr>"+x.map(r=>'<tr><td>'+esc(r.name)+'</td><td><span class="pill">'+esc(r.service_mode)+'</span></td><td>'+r.operator_count+'</td><td>'+r.authorized_taxi_count+'</td><td>'+esc(r.active?"ACTIVE":"INACTIVE")+'</td><td><button class="'+(r.active?"danger":"good")+'" onclick="routeStatus(\''+r.id+'\','+(r.active?0:1)+')">'+(r.active?"Deactivate":"Activate")+'</button></td></tr>').join("")+"</table>"}
function renderUsers(x){$("usersTable").innerHTML="<h3>Users</h3><table><tr><th>Name</th><th>Role</th><th>Phone</th><th>Operators</th><th>Status</th><th>Last login</th></tr>"+x.map(u=>'<tr><td>'+esc(u.name)+'</td><td>'+esc(u.system_role||u.role)+'</td><td>'+esc(u.phone)+'</td><td>'+esc(u.operators)+'</td><td>'+esc(u.active?"ACTIVE":"INACTIVE")+'</td><td>'+esc(u.last_login_at)+'</td></tr>').join("")+"</table>"}
function renderTaxis(x){$("taxisTable").innerHTML="<h3>Fleet</h3><table><tr><th>Registration</th><th>Operator</th><th>Driver</th><th>Status</th><th>Capacity</th><th>Routes</th></tr>"+x.map(t=>'<tr><td>'+esc(t.vehicle_registration_number)+'</td><td>'+esc(t.operator_name)+'</td><td>'+esc(t.driver_name)+'</td><td>'+esc(t.status)+'</td><td>'+t.capacity+'</td><td>'+t.authorized_route_count+'</td></tr>').join("")+"</table>"}
function renderTrips(x){$("tripsTable").innerHTML="<h3>Recent trips</h3><table><tr><th>Route</th><th>Operator</th><th>Taxi</th><th>Driver</th><th>Status</th><th>Passengers</th></tr>"+x.map(t=>'<tr><td>'+esc(t.route_id)+'</td><td>'+esc(t.operator_name)+'</td><td>'+esc(t.vehicle_registration_number)+'</td><td>'+esc(t.driver_account_name)+'</td><td>'+esc(t.status)+'</td><td>'+esc(t.passengers_onboard)+'</td></tr>').join("")+"</table>"}
function renderAudit(x){$("auditTable").innerHTML="<h3>Audit log</h3><table><tr><th>Time</th><th>Actor</th><th>Action</th><th>Entity</th><th>Operator</th><th>Details</th></tr>"+x.map(a=>'<tr><td>'+esc(new Date(Number(a.timestamp)).toISOString())+'</td><td>'+esc(a.actor_name)+'</td><td>'+esc(a.action)+'</td><td>'+esc(a.entity_type)+' '+esc(a.entity_id)+'</td><td>'+esc(a.operator_name)+'</td><td>'+esc(a.details_json)+'</td></tr>').join("")+"</table>"}
function renderIncidents(x){$("incidentsTable").innerHTML="<h3>System incidents</h3><table><tr><th>Time</th><th>Severity</th><th>Source</th><th>Message</th><th>Status</th><th></th></tr>"+x.map(i=>'<tr><td>'+esc(new Date(Number(i.created_at)).toISOString())+'</td><td>'+esc(i.severity)+'</td><td>'+esc(i.source)+'</td><td>'+esc(i.message)+'</td><td>'+esc(i.status)+'</td><td>'+(i.status!=="RESOLVED"?'<button onclick="incidentStatus(\''+i.id+'\',\'RESOLVED\')">Resolve</button>':"")+'</td></tr>').join("")+"</table>"}
async function createOperator(){await api("/superadmin/operator/create",{method:"POST",body:JSON.stringify({name:$("opName").value,registrationNumber:$("opReg").value,phone:$("opPhone").value,email:$("opEmail").value,address:$("opAddress").value})});await loadAll()}
async function createRoute(){await api("/superadmin/route/create",{method:"POST",body:JSON.stringify({origin:$("rOrigin").value,destination:$("rDestination").value,name:$("rName").value,serviceMode:$("rMode").value})});await loadAll()}
async function operatorStatus(id,active){await api("/superadmin/operator/status",{method:"POST",body:JSON.stringify({operatorId:id,active:!!active})});await loadAll()}
async function routeStatus(id,active){await api("/superadmin/route/status",{method:"POST",body:JSON.stringify({routeId:id,active:!!active})});await loadAll()}
async function incidentStatus(id,status){await api("/superadmin/incident/status",{method:"POST",body:JSON.stringify({incidentId:id,status})});await loadAll()}
</script>
</body></html>
