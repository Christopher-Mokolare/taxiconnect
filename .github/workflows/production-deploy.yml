name: TaxiConnect Production Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: bb3ec8cb5cabb7e1e726497329756e7b
    defaults:
      run:
        working-directory: cloudflare

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned Wrangler
        run: npm install

      - name: Validate Worker
        run: node --check src/index.js

      - name: Apply production D1 migrations
        run: npx wrangler@4.134.0 d1 migrations apply taxiconnect --remote

      - name: Deploy Worker and static assets
        run: npx wrangler@4.134.0 deploy --env production

      - name: Verify deployment
        run: npx wrangler@4.134.0 deployments list --name taxiconnect-api --limit 1
