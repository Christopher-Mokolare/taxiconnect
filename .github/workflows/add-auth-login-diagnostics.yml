name: Add Auth Login Diagnostics

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  instrument:
    if: >-
      github.event.head_commit.message != 'chore: instrument auth login diagnostics'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instrument authLogin
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("cloudflare/src/index.js")
          text = path.read_text()

          replacements = [
              (
                  'async function authLogin(env, body) {',
                  '''async function authLogin(env, body) {
            console.log("AUTH_LOGIN_START");'''
              ),
              (
                  '''  if (pin !== pinMap[role]) {
    throw new HttpError("Invalid PIN.", 401);
  }

  let user;''',
                  '''  if (pin !== pinMap[role]) {
    console.log("AUTH_LOGIN_PIN_INVALID");
    throw new HttpError("Invalid PIN.", 401);
  }

  console.log("AUTH_LOGIN_PIN_OK");
  let user;'''
              ),
              (
                  '''  if (!user) {
    throw new HttpError("Account is not provisioned.", 403);
  }

  const effectiveRole = user.system_role || user.role;''',
                  '''  if (!user) {
    console.log("AUTH_LOGIN_USER_NOT_FOUND");
    throw new HttpError("Account is not provisioned.", 403);
  }

  console.log("AUTH_LOGIN_USER_LOOKUP_OK");
  const effectiveRole = user.system_role || user.role;'''
              ),
              (
                  '''  const token = await createSession(env, user);

  const memberships =''',
                  '''  console.log("AUTH_LOGIN_SESSION_START");
  const token = await createSession(env, user);
  console.log("AUTH_LOGIN_SESSION_OK");

  const memberships ='''
              ),
              (
                  '''  const memberships =
    role === "superadmin"
      ? []
      : (
          await getOperatorMemberships(env, user.id)
        ).results || [];

  try {''',
                  '''  const memberships =
    role === "superadmin"
      ? []
      : (
          await getOperatorMemberships(env, user.id)
        ).results || [];

  console.log("AUTH_LOGIN_MEMBERSHIPS_OK");

  try {'''
              ),
              (
                  '''  return ok({
    token,
    user: {''',
                  '''  console.log("AUTH_LOGIN_RESPONSE_READY");
  return ok({
    token,
    user: {'''
              )
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Expected authLogin text not found: {old[:100]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Validate syntax
        run: node --check cloudflare/src/index.js

      - name: Commit diagnostics and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/src/index.js
          git rm .github/workflows/add-auth-login-diagnostics.yml
          git commit -m "chore: instrument auth login diagnostics"
          git push
